name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Report runner toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build command-line tools
        run: |
          swift build -c release --product ApplePackageTool
          swift build -c release --product AppleSAPTool

      - name: Package artifact
        run: |
          set -euo pipefail

          product_name="ApplePackageTool"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          arch="$(uname -m)"
          artifact_name="${product_name}-${safe_ref}-macos-${arch}"
          artifact_dir="${RUNNER_TEMP}/${artifact_name}"
          build_dir="$(swift build -c release --show-bin-path)"
          binary_path="${build_dir}/${product_name}"
          sap_binary_path="${build_dir}/AppleSAPTool"
          sap_resources="${build_dir}/ApplePackage_AppleSAPKit.bundle"

          if [[ ! -x "${binary_path}" ]]; then
            echo "::error::Built binary ${product_name} was not found"
            exit 1
          fi
          if [[ ! -d "${sap_resources}" ]]; then
            echo "::error::AppleSAPKit static table resource bundle was not found"
            exit 1
          fi
          if [[ ! -x "${sap_binary_path}" ]]; then
            echo "::error::Built binary AppleSAPTool was not found"
            exit 1
          fi

          mkdir -p "${artifact_dir}"
          cp "${binary_path}" "${artifact_dir}/${product_name}"
          cp "${sap_binary_path}" "${artifact_dir}/AppleSAPTool"
          cp -R "${sap_resources}" "${artifact_dir}/"

          printf '%s\n' \
            "Requires macOS 15 or later." \
            "Keep ApplePackage_AppleSAPKit.bundle next to both tools; it contains the SAP static tables." \
            > "${artifact_dir}/README.txt"

          (cd "${RUNNER_TEMP}" && ditto -c -k --sequesterRsrc --keepParent "${artifact_name}" "${GITHUB_WORKSPACE}/${artifact_name}.zip")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          safe_ref="${GITHUB_REF_NAME//\//-}"
          arch="$(uname -m)"
          gh release upload "${GITHUB_REF_NAME}" \
            "ApplePackageTool-${safe_ref}-macos-${arch}.zip" \
            --clobber
